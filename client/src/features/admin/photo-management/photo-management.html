@if (photos(); as photos) {
@if (photos.length > 0) {
<div class="grid grid-cols-6 auto-rows-min gap-3 p-5 h-[65vh] overflow-auto">
    @for (photo of photos; track photo.id) {
    <div class="relative w-44">
        <span class="ml-2" [routerLink]="'/members/' + photo.memberId">
            Photo of <span class="text-primary cursor-pointer">
                {{(photo.memberId | memberName | async) ?? 'Loading...'}}
            </span>
        </span>
        <img src="{{photo.url}}" alt="photo of member" class="rounded-lg w-full p-1">
        <div class='flex w-full gap-3'>
            <button class='btn btn-success grow'
                (click)='approvePhoto(photo.id)'>Approve</button>
            <button class='btn btn-error grow'
                (click)='rejectPhoto(photo.id)'>Reject</button>
        </div>

    </div>
    }
</div>
} @else {
<p class="text-center text-gray-500">No photos available</p>
}
}
